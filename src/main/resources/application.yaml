spring:
  application:
    name: dozy-wms-api

  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dozy_wms}?useSSL=false&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    enabled: true
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dozy_wms}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    user: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # 브로커가 응답하지 않으면 발행기가 오래 막히지 않고 실패로 처리해 다음 주기에 다시 시도한다
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

dozy:
  auth:
    audience: wms
    accepted-realms: [internal]
    # 다른 서비스(inventory)를 system client로 호출할 때 쓴다. 켜면 AUTH_CLIENT_ID·AUTH_CLIENT_SECRET이 필요하다(비밀은 환경변수로만 주입한다)
    client:
      enabled: ${AUTH_CLIENT_ENABLED:false}
      client-id: ${AUTH_CLIENT_ID:}
      client-secret: ${AUTH_CLIENT_SECRET:}
    issuer-base-uri: ${AUTH_ISSUER_BASE_URI:http://localhost:8081}

wms:
  # 직원 창고 소속 변경 이벤트 발행(ADR-0020). 테스트에서는 발행기와 토픽 생성을 끈다
  warehouse-access-event:
    publisher:
      enabled: true
      interval: PT5S
      batch-size: 50
      lease: PT1M
      base-backoff: PT5S
      max-backoff: PT5M
      alert-after-attempts: 10
    topic:
      name: dozy.wms.warehouse-access
      partitions: 3
      replicas: 1
  # inventory 서비스 호출 아웃박스(ADR-0019). 테스트에서는 전송기를 끈다
  inventory-call:
    base-url: ${INVENTORY_BASE_URL:}
    timeout: PT10S
    dispatch:
      enabled: true
      interval: PT5S
      batch-size: 20
      base-backoff: PT5S
      max-backoff: PT10M
      alert-after-attempts: 10
  expiration-monitoring:
    cron: "0 0 1 * * *"
  stock-audit:
    adjustment-approval-threshold: 10
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
